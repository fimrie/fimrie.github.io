    links:
      - label: "Journal"
        url: "https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1623339/full"
    archived: n

  - date: "2025/06"
    text: "The OpenBind Consortium received an £8m grant from the UK Sovereign AI Unit (DSIT) to power the next era of AI/ML for drug discovery."
    links:
      - label: "Link"
        url: "https://openbind.uk/"
    archived: n

  - date: "2025/05"
    text: "We released ChemIQ, our new benchmark to assess the chemical intelligence of large language models. Updated with additional LLMs in July 2025."
    links:
      - label: "Preprint"
        url: "https://arxiv.org/abs/2505.07735"
    archived: n

