  - date: "2025/12"
    text: "ChemIQ, our benchmark to assess the chemical intelligence of large language models, was published in the Journal of Chemical Information and Modeling."
    links:
      - label: "Paper"
        url: "https://pubs.acs.org/doi/10.1021/acs.jcim.5c02145"
    archived: n

