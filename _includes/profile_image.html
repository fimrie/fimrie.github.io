<a href="{{ '/' | relative_url }}">
  <img class="profile-image u-max-full-width"
       src="{{ site.data.main_info.profile_pic | relative_url }}"
       srcset="{{ site.data.main_info.profile_pic_small | relative_url }} 320w, {{ site.data.main_info.profile_pic | relative_url }} 640w"
       sizes="(max-width: 549px) 96px, (max-width: 999px) 24.54vw, 246px"
       width="640" height="800"
       alt="{{ site.data.main_info.name }}"
       decoding="async" fetchpriority="high">
</a>
