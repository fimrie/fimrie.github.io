<meta property="og:title" content="{{ site.social_title | escape }}" />
<meta property="og:description" content="{{ site.description | escape }}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}" />
<meta property="og:site_name" content="{{ site.data.main_info.name | escape }}" />
<meta property="og:image" content="{{ site.data.main_info.profile_pic | absolute_url }}" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="640" />
<meta property="og:image:height" content="800" />
<meta property="og:image:alt" content="Portrait of {{ site.data.main_info.name | escape }}" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ site.social_title | escape }}" />
<meta name="twitter:description" content="{{ site.description | escape }}" />
<meta name="twitter:image" content="{{ site.data.main_info.profile_pic | absolute_url }}" />
<meta name="twitter:image:alt" content="Portrait of {{ site.data.main_info.name | escape }}" />
