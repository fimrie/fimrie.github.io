{% if jekyll.environment == "production" and site.google_tag_manager_id %}
  {% if include.placement == "head" %}
    <!-- Google Tag Manager -->
    <script>
      // Only collect analytics on the configured production host.
      if (window.location.hostname === new URL({{ site.url | jsonify }}).hostname) {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer',{{ site.google_tag_manager_id | jsonify }});
      }
    </script>
  {% elsif include.placement == "body" %}
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.google_tag_manager_id | escape }}"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  {% endif %}
{% endif %}
